---
- name: Find service configs
  find:
    paths: "/etc/stereum/services"
  register: service_config_files

- name: Include Obol Exit Changes
  include_tasks: obol_exit_changes.yaml
  loop: "{{ service_config_files.files }}"
  loop_control:
    loop_var: config_file

- name: Include Teku Changes
  include_tasks: teku_changes.yaml
  loop: "{{ service_config_files.files }}"
  loop_control:
    loop_var: config_file

- name: Include Ejector EJECTOR_SCOPE Changes
  include_tasks: ejector_changes.yaml
  loop: "{{ service_config_files.files }}"
  loop_control:
    loop_var: config_file

- name: Include LCOM Changes
  include_tasks: lcom_changes.yaml
  loop: "{{ service_config_files.files }}"
  loop_control:
    loop_var: config_file

# The ValidatorEjector oracle allowlist refresh moved to 2.5.2
# (tasks/2.5.2/oracle_allowlist_changes.yaml) with the current member set.
# Only one oracle-allowlist script may be active at a time, otherwise the
# scripts overwrite each other every run (idempotence failure), so
# oracle_allowlist_changes is no longer included here.
