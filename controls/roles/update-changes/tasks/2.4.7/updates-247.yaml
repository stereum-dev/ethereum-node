---
- name: Find service configs
  find:
    paths: "/etc/stereum/services"
  register: service_config_files

- name: Include Lighthouse Changes
  include_tasks: lighthouse_changes.yaml
  loop: "{{ service_config_files.files }}"
  loop_control:
    loop_var: config_file

- name: Include Lodestar Changes
  include_tasks: lodestar_changes.yaml
  loop: "{{ service_config_files.files }}"
  loop_control:
    loop_var: config_file

# The ValidatorEjector oracle allowlist refresh moved to 2.4.10
# (tasks/2.4.10/oracle_allowlist_changes.yaml) with the current on-chain member
# set. Only one oracle-allowlist script may be active at a time, otherwise the
# scripts overwrite each other every run (idempotence failure), so ejector_changes
# is no longer included here.
