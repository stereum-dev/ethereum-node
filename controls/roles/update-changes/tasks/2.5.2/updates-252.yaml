---
- name: Find service configs
  find:
    paths: "/etc/stereum/services"
  register: service_config_files

- name: Include Nimbus Engine API Changes
  include_tasks: nimbus_engine_changes.yaml
  loop: "{{ service_config_files.files }}"
  loop_control:
    loop_var: config_file

# The oracle allowlist refresh moved to 2.6.1; only one allowlist script may be
# active, otherwise they overwrite each other every run
