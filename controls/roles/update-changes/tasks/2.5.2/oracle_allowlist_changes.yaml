---
- name: Read service file
  slurp:
    src: "{{ config_file.path }}"
  register: service_configuration_raw

# Lido's oracle member allowlist changed again: mainnet adds nine members on top of
# the 2.5.0 set (18 total), hoodi replaces nine of its ten. Refresh
# ORACLE_ADDRESSES_ALLOWLIST for existing ValidatorEjector configs. Guarded on a diff
# so it is a no-op once applied.
- name: Parse service's configuration
  set_fact:
    service_configuration: "{{ service_configuration_raw['content'] | b64decode | from_yaml }}"
    mainnet_oracle_allowlist: '["0x73181107c8D9ED4ce0bbeF7A0b4ccf3320C41d12","0x4118DAD7f348A4063bD15786c299De2f3B1333F3","0x404335BcE530400a5814375E7Ec1FB55fAff3eA2","0x8dB977C13CAA938BC58464bFD622DF0570564b78","0x007DE4a5F7bc37E2F26c0cb2E8A95006EE9B89b5","0xc79F702202E3A6B0B6310B537E786B9ACAA19BAf","0x61c91ECd902EB56e314bB2D5c5C07785444Ea1c8","0xe57B3792aDCc5da47EF4fF588883F0ee0c9835C9","0x042a9e5acCfa17e28300F1b5967f20891E973922","0x5595033F304217aFDB8ffB35E42C22B72184730b","0x82A821E8a2585D1AC8f346BE7Da6995490d21Ca6","0x7abC999C7E1f22a7E12b2A1024bC17676FE18b4b","0x5416CAAb6f37BF81cb2dc7ce0a363AfB9DD92d57","0x565F04cB319EC2295E1fcbBbe5F708687FFcCE75","0x4D3aD7E8e591d389B612Fc063f53837E284d3F86","0x375ABa35EA2011Af97b51bd395494C827d1C39BD","0xC10258969442c7957351A0ddc8194D2685B2a2c2","0x2aE828F10DfeE5b4c42f6E61D3d30033D4520753"]'
    hoodi_oracle_allowlist: '["0xcA80ee7313A315879f326105134F938676Cfd7a9","0xAe13D937a042aeD48Eb67EFa935972b188578977","0xe9FCd8c6CA10414E1955a8366Ea72eD1BbAFC3Bf","0x3E32F6E0E9A2f55eF6Ee4075bb249c8E88a42A15","0x6070B31816E11A8b222Fa232266FFdDC02bED02b","0xcad8AeeEd49158E20F8429B28520541cFa2C27b1","0x049B1d2F7578Bb56F9B75fcE6a3ee5C40551e694","0xEDF5163607997899B91BEBD4feb1d5D78c896b57","0xBD9d87c5CAD402447408665E36b1e550a84E746B","0xad4C09E3cc0bCE7FF70bb23f624Cc9dE86eba556"]'

- name: Update Oracle Allow List (mainnet)
  replace:
    path: "{{ config_file.path }}"
    regexp: "ORACLE_ADDRESSES_ALLOWLIST:.*"
    replace: "ORACLE_ADDRESSES_ALLOWLIST: '{{ mainnet_oracle_allowlist }}'"
  when:
    - service_configuration.service == "ValidatorEjectorService"
    - service_configuration.network == "mainnet"
    - service_configuration.env.ORACLE_ADDRESSES_ALLOWLIST is defined
    - (service_configuration.env.ORACLE_ADDRESSES_ALLOWLIST | from_yaml | difference(mainnet_oracle_allowlist | from_yaml) | length != 0) or (service_configuration.env.ORACLE_ADDRESSES_ALLOWLIST | from_yaml | length) != (mainnet_oracle_allowlist | from_yaml | length)

- name: Update Oracle Allow List (hoodi)
  replace:
    path: "{{ config_file.path }}"
    regexp: "ORACLE_ADDRESSES_ALLOWLIST:.*"
    replace: "ORACLE_ADDRESSES_ALLOWLIST: '{{ hoodi_oracle_allowlist }}'"
  when:
    - service_configuration.service == "ValidatorEjectorService"
    - service_configuration.network == "hoodi"
    - service_configuration.env.ORACLE_ADDRESSES_ALLOWLIST is defined
    - (service_configuration.env.ORACLE_ADDRESSES_ALLOWLIST | from_yaml | difference(hoodi_oracle_allowlist | from_yaml) | length != 0) or (service_configuration.env.ORACLE_ADDRESSES_ALLOWLIST | from_yaml | length) != (hoodi_oracle_allowlist | from_yaml | length)
