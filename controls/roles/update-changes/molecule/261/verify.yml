---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    mainnet_oracle_allowlist: '["0x73181107c8D9ED4ce0bbeF7A0b4ccf3320C41d12","0x4118DAD7f348A4063bD15786c299De2f3B1333F3","0x404335BcE530400a5814375E7Ec1FB55fAff3eA2","0x8dB977C13CAA938BC58464bFD622DF0570564b78","0x007DE4a5F7bc37E2F26c0cb2E8A95006EE9B89b5","0xc79F702202E3A6B0B6310B537E786B9ACAA19BAf","0x61c91ECd902EB56e314bB2D5c5C07785444Ea1c8","0xe57B3792aDCc5da47EF4fF588883F0ee0c9835C9","0x042a9e5acCfa17e28300F1b5967f20891E973922","0x5595033F304217aFDB8ffB35E42C22B72184730b","0x82A821E8a2585D1AC8f346BE7Da6995490d21Ca6","0x7abC999C7E1f22a7E12b2A1024bC17676FE18b4b","0x5416CAAb6f37BF81cb2dc7ce0a363AfB9DD92d57","0x565F04cB319EC2295E1fcbBbe5F708687FFcCE75","0x4D3aD7E8e591d389B612Fc063f53837E284d3F86","0x375ABa35EA2011Af97b51bd395494C827d1C39BD","0xC10258969442c7957351A0ddc8194D2685B2a2c2","0x2aE828F10DfeE5b4c42f6E61D3d30033D4520753","0x3f0dAF0066533bE244dBeF17fDD21fb1F24F41e0","0x0194Ab59A22b6787ef7529954142B269824551d2"]'
    hoodi_oracle_allowlist: '["0xcA80ee7313A315879f326105134F938676Cfd7a9","0xAe13D937a042aeD48Eb67EFa935972b188578977","0xe9FCd8c6CA10414E1955a8366Ea72eD1BbAFC3Bf","0x3E32F6E0E9A2f55eF6Ee4075bb249c8E88a42A15","0x6070B31816E11A8b222Fa232266FFdDC02bED02b","0xcad8AeeEd49158E20F8429B28520541cFa2C27b1","0x049B1d2F7578Bb56F9B75fcE6a3ee5C40551e694","0xEDF5163607997899B91BEBD4feb1d5D78c896b57","0xBD9d87c5CAD402447408665E36b1e550a84E746B","0xad4C09E3cc0bCE7FF70bb23f624Cc9dE86eba556","0xf39c47F5f3088Bdce193e3B8684af6509a486177","0x4D9E766204112Cc1d09f0937A621737D66c45129"]'
    stale_mainnet_oracle_allowlist: '["0x73181107c8D9ED4ce0bbeF7A0b4ccf3320C41d12","0x4118DAD7f348A4063bD15786c299De2f3B1333F3","0x404335BcE530400a5814375E7Ec1FB55fAff3eA2","0x8dB977C13CAA938BC58464bFD622DF0570564b78","0x007DE4a5F7bc37E2F26c0cb2E8A95006EE9B89b5","0xc79F702202E3A6B0B6310B537E786B9ACAA19BAf","0x61c91ECd902EB56e314bB2D5c5C07785444Ea1c8","0xe57B3792aDCc5da47EF4fF588883F0ee0c9835C9","0x042a9e5acCfa17e28300F1b5967f20891E973922"]'
  tasks:
    - name: Read ValidatorEjectorService files
      slurp:
        src: "/etc/stereum/services/{{ item }}.yaml"
      loop:
        - ec70a261-0000-0000-0000-000000000001
        - ec70a261-0000-0000-0000-000000000002
        - ec70a261-0000-0000-0000-000000000003
        - ec70a261-0000-0000-0000-000000000004
      register: ejector_configuration_raw

    - name: Collect each ejector's allowlist
      set_fact:
        allowlists: >-
          {{ allowlists | default({}) | combine({
               item.item: (item['content'] | b64decode | from_yaml).env.ORACLE_ADDRESSES_ALLOWLIST | from_yaml
             }) }}
      loop: "{{ ejector_configuration_raw.results }}"
      loop_control:
        label: "{{ item.item }}"

    - debug:
        msg: "{{ allowlists }}"

    - name: Assert the mainnet ejector got the 20 address allowlist
      assert:
        that:
          - allowlists['ec70a261-0000-0000-0000-000000000001'] == mainnet_oracle_allowlist | from_yaml
          - (allowlists['ec70a261-0000-0000-0000-000000000001'] | length) == 20
        fail_msg: "mainnet allowlist not refreshed: {{ allowlists['ec70a261-0000-0000-0000-000000000001'] }}"

    - name: Assert the hoodi ejector got the new allowlist
      assert:
        that:
          - allowlists['ec70a261-0000-0000-0000-000000000002'] == hoodi_oracle_allowlist | from_yaml
          - (allowlists['ec70a261-0000-0000-0000-000000000002'] | length) == 12
        fail_msg: "hoodi allowlist not refreshed: {{ allowlists['ec70a261-0000-0000-0000-000000000002'] }}"

    - name: Assert a sepolia ejector was left alone
      assert:
        that:
          - allowlists['ec70a261-0000-0000-0000-000000000004'] == stale_mainnet_oracle_allowlist | from_yaml
        fail_msg: "sepolia allowlist was rewritten: {{ allowlists['ec70a261-0000-0000-0000-000000000004'] }}"

    - name: Stat the ejector configs
      stat:
        path: "/etc/stereum/services/{{ item }}.yaml"
      loop:
        - ec70a261-0000-0000-0000-000000000001
        - ec70a261-0000-0000-0000-000000000003
      register: ejector_stats

    # the already migrated config must still carry the back date from prepare
    - name: Assert an already migrated config was not rewritten
      assert:
        that:
          - ejector_stats.results[1].stat.mtime < ejector_stats.results[0].stat.mtime
        fail_msg: "already migrated config was touched: {{ ejector_stats.results | map(attribute='stat.mtime') | list }}"
# EOF
