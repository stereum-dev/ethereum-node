          image: flashbots/mev-boost:v0.8.2
          ports: []
          volumes: []
          user: "2000"
          autoupdate: true
          network: mainnet
          dependencies:
            executionClients: []
            consensusClients: []
            mevboost: []
            otherServices: []
      become: yes

