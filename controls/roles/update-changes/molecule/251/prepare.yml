        dest: "/etc/stereum/services/mev00001-0000-0000-0000-000000000001.yaml"
        owner: "root"
        group: "root"
        mode: 0644
        content: |
          service: FlashbotsMevBoostService
          id: mev00001-0000-0000-0000-000000000001
          configVersion: 1
          command: null
          entrypoint:
            - /app/mev-boost
            - -addr
            - 0.0.0.0:18550
            - -mainnet
            - -relay-check
            - -relays
            - https://0xac6e77dfe25ecd6110b8e780608cce0dab71fdd5ebea22a16c0205200f2f8e2e3ad3b71d3499c54ad14d6c21b41a37ae@boost-relay.flashbots.net,https://0x98650451ba02064f7b000f5768cf0cf4d4e492317d82871bdc87ef841a0743f69f0f1eea11168503240ac35d101c9135@mainnet-relay.securerpc.com,https://0x8c4ed5e24fe5c6ae21018437bde147693f68cda427cd1122cf20819c30eda7ed74f72dece09bb313f2a1855595ab677d@global.titanrelay.xyz,https://0x8b5d2e73e2a3a55c6c87b8b6eb92e0149a125c852751db1422fa951e42a09b82c142c3ea98d0d9930b056a3bc9896b8f@bloxroute.max-profit.blxrbdn.com
