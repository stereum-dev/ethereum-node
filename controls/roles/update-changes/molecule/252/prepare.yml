      copy:
        dest: "/etc/stereum/services/ec70a252-0000-0000-0000-000000000001.yaml"
        owner: "root"
        group: "root"
        mode: 0644
        content: |
          service: ValidatorEjectorService
          id: ec70a252-0000-0000-0000-000000000001
          configVersion: 1
          command: []
          entrypoint: []
          env:
            EXECUTION_NODE: http://stereum-57277de9-a1e8-b4bb-6b8f-f4417905d9b4:8545
            CONSENSUS_NODE: http://stereum-6c2c02b0-7918-a378-0c6a-91c41214f93f:5051
            LOCATOR_ADDRESS: "0xC1d0b3DE6792Bf6b4b37EccdcC24e45978Cfd2Eb"
            EJECTOR_SCOPE: '{"1":[42]}'
            MESSAGES_LOCATION: /app/messages
            ORACLE_ADDRESSES_ALLOWLIST: '["0x73181107c8D9ED4ce0bbeF7A0b4ccf3320C41d12","0x4118DAD7f348A4063bD15786c299De2f3B1333F3","0x404335BcE530400a5814375E7Ec1FB55fAff3eA2","0x8dB977C13CAA938BC58464bFD622DF0570564b78","0x007DE4a5F7bc37E2F26c0cb2E8A95006EE9B89b5","0xc79F702202E3A6B0B6310B537E786B9ACAA19BAf","0x61c91ECd902EB56e314bB2D5c5C07785444Ea1c8","0xe57B3792aDCc5da47EF4fF588883F0ee0c9835C9","0x042a9e5acCfa17e28300F1b5967f20891E973922"]'
            HTTP_PORT: "8989"
            RUN_METRICS: "true"
            RUN_HEALTH_CHECK: "true"
            DRY_RUN: "false"
          image: lidofinance/validator-ejector:2.1.0
          ports: []
          volumes:
            - /opt/stereum/validatorejector-ec70a252-0000-0000-0000-000000000001/messages:/app/messages
          user: "2000"
          autoupdate: true
          network: mainnet
          dependencies:
            executionClients: []
            consensusClients: []
            mevboost: []
            otherServices: []
      become: yes

    - name: Create ValidatorEjectorService config (hoodi, 2.5.0 allowlist)
      copy:
        dest: "/etc/stereum/services/ec70a252-0000-0000-0000-000000000002.yaml"
        owner: "root"
        group: "root"
        mode: 0644
