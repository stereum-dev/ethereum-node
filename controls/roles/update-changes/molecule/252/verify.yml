---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    mainnet_oracle_allowlist: '["0x73181107c8D9ED4ce0bbeF7A0b4ccf3320C41d12","0x4118DAD7f348A4063bD15786c299De2f3B1333F3","0x404335BcE530400a5814375E7Ec1FB55fAff3eA2","0x8dB977C13CAA938BC58464bFD622DF0570564b78","0x007DE4a5F7bc37E2F26c0cb2E8A95006EE9B89b5","0xc79F702202E3A6B0B6310B537E786B9ACAA19BAf","0x61c91ECd902EB56e314bB2D5c5C07785444Ea1c8","0xe57B3792aDCc5da47EF4fF588883F0ee0c9835C9","0x042a9e5acCfa17e28300F1b5967f20891E973922","0x5595033F304217aFDB8ffB35E42C22B72184730b","0x82A821E8a2585D1AC8f346BE7Da6995490d21Ca6","0x7abC999C7E1f22a7E12b2A1024bC17676FE18b4b","0x5416CAAb6f37BF81cb2dc7ce0a363AfB9DD92d57","0x565F04cB319EC2295E1fcbBbe5F708687FFcCE75","0x4D3aD7E8e591d389B612Fc063f53837E284d3F86","0x375ABa35EA2011Af97b51bd395494C827d1C39BD","0xC10258969442c7957351A0ddc8194D2685B2a2c2","0x2aE828F10DfeE5b4c42f6E61D3d30033D4520753"]'
    hoodi_oracle_allowlist: '["0xcA80ee7313A315879f326105134F938676Cfd7a9","0xAe13D937a042aeD48Eb67EFa935972b188578977","0xe9FCd8c6CA10414E1955a8366Ea72eD1BbAFC3Bf","0x3E32F6E0E9A2f55eF6Ee4075bb249c8E88a42A15","0x6070B31816E11A8b222Fa232266FFdDC02bED02b","0xcad8AeeEd49158E20F8429B28520541cFa2C27b1","0x049B1d2F7578Bb56F9B75fcE6a3ee5C40551e694","0xEDF5163607997899B91BEBD4feb1d5D78c896b57","0xBD9d87c5CAD402447408665E36b1e550a84E746B","0xad4C09E3cc0bCE7FF70bb23f624Cc9dE86eba556"]'
    stale_mainnet_oracle_allowlist: '["0x73181107c8D9ED4ce0bbeF7A0b4ccf3320C41d12","0x4118DAD7f348A4063bD15786c299De2f3B1333F3","0x404335BcE530400a5814375E7Ec1FB55fAff3eA2","0x8dB977C13CAA938BC58464bFD622DF0570564b78","0x007DE4a5F7bc37E2F26c0cb2E8A95006EE9B89b5","0xc79F702202E3A6B0B6310B537E786B9ACAA19BAf","0x61c91ECd902EB56e314bB2D5c5C07785444Ea1c8","0xe57B3792aDCc5da47EF4fF588883F0ee0c9835C9","0x042a9e5acCfa17e28300F1b5967f20891E973922"]'
  tasks:
    - name: Read service files
      slurp:
        src: "/etc/stereum/services/{{ item }}.yaml"
      loop:
        - nim00001-0000-0000-0000-000000000001
        - nim00002-0000-0000-0000-000000000002
        - nim00003-0000-0000-0000-000000000003
        - nim00004-0000-0000-0000-000000000004
        - pry00001-0000-0000-0000-000000000001
      register: service_configuration_raw

    - name: Collect each service's command
      set_fact:
        commands: >-
          {{ commands | default({}) | combine({
               item.item: (item['content'] | b64decode | from_yaml).command
             }) }}
      loop: "{{ service_configuration_raw.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Collect the engine URLs Nimbus was given, under whichever flag names it
      set_fact:
        engine_urls: >-
          {{ engine_urls | default({}) | combine({
               item.key: (item.value | select('match', '^(--el|--web3-url)=') | first | default('')
                         | regex_replace('^(--el|--web3-url)=', '')).split(',')
             }) }}
      loop: "{{ commands | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.key is search('^nim')

    - debug:
        msg: "{{ engine_urls }}"

    - name: Assert a single ws engine URL was moved to http under --el
      assert:
        that:
          - commands['nim00001-0000-0000-0000-000000000001'] | select('match', '^--el=') | length == 1
          - (engine_urls['nim00001-0000-0000-0000-000000000001'] | length) == 1
          - engine_urls['nim00001-0000-0000-0000-000000000001'][0]
            == 'http://stereum-besu0001-0000-0000-0000-000000000001:8551'
        fail_msg: "not migrated: {{ commands['nim00001-0000-0000-0000-000000000001'] }}"

    - name: Assert every URL of a multi client list was moved to http under --el
      assert:
        that:
          - commands['nim00002-0000-0000-0000-000000000002'] | select('match', '^--el=') | length == 1
          - (engine_urls['nim00002-0000-0000-0000-000000000002'] | length) == 2
          - engine_urls['nim00002-0000-0000-0000-000000000002'][0]
            == 'http://stereum-besu0002-0000-0000-0000-000000000002:8551'
          - engine_urls['nim00002-0000-0000-0000-000000000002'][1]
            == 'http://stereum-neth0001-0000-0000-0000-000000000001:8551'
        fail_msg: "not all migrated: {{ commands['nim00002-0000-0000-0000-000000000002'] }}"

    - name: Assert an already migrated config was left untouched
      assert:
        that:
          - commands['nim00003-0000-0000-0000-000000000003'] | select('match', '^--el=') | length == 1
          - engine_urls['nim00003-0000-0000-0000-000000000003'][0]
            == 'http://stereum-neth0002-0000-0000-0000-000000000002:8551'
        fail_msg: "migrated config was modified: {{ commands['nim00003-0000-0000-0000-000000000003'] }}"

    - name: Assert an external execution client keeps its own scheme
      assert:
        that:
          - commands['nim00004-0000-0000-0000-000000000004'] | select('match', '^--el=') | length == 1
          - engine_urls['nim00004-0000-0000-0000-000000000004'][0] == 'ws://el.example.com:8551'
        fail_msg: "external client was rewritten: {{ commands['nim00004-0000-0000-0000-000000000004'] }}"

    - name: Assert a non Nimbus service was left untouched
      assert:
        that:
          - commands['pry00001-0000-0000-0000-000000000001'] | select('search', 'ws://stereum-') | length == 1
        fail_msg: "prysm was rewritten: {{ commands['pry00001-0000-0000-0000-000000000001'] }}"

    - name: Assert no Nimbus config still points at a Stereum client over ws
      assert:
        that:
          - commands[item] | select('search', 'ws://stereum-') | length == 0
        fail_msg: "{{ item }} still has a ws engine URL: {{ commands[item] }}"
      loop: "{{ engine_urls.keys() | list }}"

    - name: Stat the execution client configs
      stat:
        path: "/etc/stereum/services/{{ item }}.yaml"
      loop:
        - besu0001-0000-0000-0000-000000000001
        - besu0002-0000-0000-0000-000000000002
        - neth0001-0000-0000-0000-000000000001
        - neth0002-0000-0000-0000-000000000002
        - ext00001-0000-0000-0000-000000000001
        - gone0001-0000-0000-0000-000000000001
      register: execution_client_stats

    - name: Index the execution client mtimes
      set_fact:
        el_mtime: >-
          {{ el_mtime | default({}) | combine({
               item.item: (item.stat.mtime | default(0))
             }) }}
        el_exists: >-
          {{ el_exists | default({}) | combine({
               item.item: item.stat.exists
             }) }}
      loop: "{{ execution_client_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    # neth0002's Nimbus was already migrated, so it still carries the back date
    - name: Assert the execution clients of migrated Nimbus nodes were touched
      assert:
        that:
          - el_mtime['besu0001-0000-0000-0000-000000000001'] > el_mtime['neth0002-0000-0000-0000-000000000002']
          - el_mtime['besu0002-0000-0000-0000-000000000002'] > el_mtime['neth0002-0000-0000-0000-000000000002']
          - el_mtime['neth0001-0000-0000-0000-000000000001'] > el_mtime['neth0002-0000-0000-0000-000000000002']
        fail_msg: "execution clients not touched: {{ el_mtime }}"

    - name: Assert an external execution client was left alone
      assert:
        that:
          - el_mtime['ext00001-0000-0000-0000-000000000001'] == el_mtime['neth0002-0000-0000-0000-000000000002']
        fail_msg: "external execution client was touched: {{ el_mtime }}"

    - name: Assert a dangling dependency id did not get a config file created
      assert:
        that:
          - not el_exists['gone0001-0000-0000-0000-000000000001']
        fail_msg: "a phantom service config was created for a dangling dependency"

    - name: Read ValidatorEjectorService files
      slurp:
        src: "/etc/stereum/services/{{ item }}.yaml"
      loop:
        - ec70a252-0000-0000-0000-000000000001
        - ec70a252-0000-0000-0000-000000000002
        - ec70a252-0000-0000-0000-000000000003
        - ec70a252-0000-0000-0000-000000000004
      register: ejector_configuration_raw

    - name: Collect each ejector's allowlist
      set_fact:
        allowlists: >-
          {{ allowlists | default({}) | combine({
               item.item: (item['content'] | b64decode | from_yaml).env.ORACLE_ADDRESSES_ALLOWLIST | from_yaml
             }) }}
      loop: "{{ ejector_configuration_raw.results }}"
      loop_control:
        label: "{{ item.item }}"

    - debug:
        msg: "{{ allowlists }}"

    - name: Assert the mainnet ejector got the 18 member allowlist
      assert:
        that:
          - allowlists['ec70a252-0000-0000-0000-000000000001'] == mainnet_oracle_allowlist | from_yaml
          - (allowlists['ec70a252-0000-0000-0000-000000000001'] | length) == 18
        fail_msg: "mainnet allowlist not refreshed: {{ allowlists['ec70a252-0000-0000-0000-000000000001'] }}"

    - name: Assert the hoodi ejector got the new allowlist
      assert:
        that:
          - allowlists['ec70a252-0000-0000-0000-000000000002'] == hoodi_oracle_allowlist | from_yaml
          - (allowlists['ec70a252-0000-0000-0000-000000000002'] | length) == 10
        fail_msg: "hoodi allowlist not refreshed: {{ allowlists['ec70a252-0000-0000-0000-000000000002'] }}"

    - name: Assert a sepolia ejector was left alone
      assert:
        that:
          - allowlists['ec70a252-0000-0000-0000-000000000004'] == stale_mainnet_oracle_allowlist | from_yaml
        fail_msg: "sepolia allowlist was rewritten: {{ allowlists['ec70a252-0000-0000-0000-000000000004'] }}"

    - name: Stat the ejector configs
      stat:
        path: "/etc/stereum/services/{{ item }}.yaml"
      loop:
        - ec70a252-0000-0000-0000-000000000001
        - ec70a252-0000-0000-0000-000000000003
      register: ejector_stats

    # the already migrated config must still carry the back date from prepare
    - name: Assert an already migrated config was not rewritten
      assert:
        that:
          - ejector_stats.results[1].stat.mtime < ejector_stats.results[0].stat.mtime
        fail_msg: "already migrated config was touched: {{ ejector_stats.results | map(attribute='stat.mtime') | list }}"
# EOF
