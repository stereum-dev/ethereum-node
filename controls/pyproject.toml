[tool.poetry]
name = "stereum-molecule-test-environment"
version = "0.1.0"
description = "A test environment for testing Ansible roles with Molecule."
authors = ["stereum.com"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
ansible = "14.3.1"
molecule = "26.8.0"
molecule-plugins = {extras = ["docker"], version = "26.7.15"}
molecule-hetznercloud = "2.8.0"
docker = "7.2.0"
hcloud = "2.23.0"
yamllint = "1.38.0"
ansible-lint = "26.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[virtualenvs]
in-project = true
